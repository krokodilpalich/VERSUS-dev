  "components": {
    "securitySchemes": {
      "session": {
        "type": "apiKey",
        "in": "cookie",
        "name": "better-auth.session_token"
      }
    },
    "schemas": {
      "ArtworkInput": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "properties": {
          "title": {
            "type": "string",
            "minLength": 2,
            "maxLength": 200
          },
          "seriesId": {
            "type": "string",
            "format": "uuid",
            "pattern": "^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$"
          },
          "captureYear": {
            "type": "integer",
            "minimum": 1800,
            "maximum": 2200
          },
          "description": {
            "type": "string",
            "minLength": 20,
            "maxLength": 10000
          },
          "genre": {
            "type": "string",
            "minLength": 2,
            "maxLength": 150
          },
          "colorMode": {
            "type": "string",
            "enum": [
              "COLOR",
              "BW"
            ]
          },
          "visibility": {
            "default": "PUBLIC",
            "type": "string",
            "enum": [
              "PUBLIC",
              "UNLISTED",
              "VERIFIED_ONLY",
              "INVITED_ONLY",
              "OWNER_AND_STAFF"
            ]
          },
          "technique": {
            "type": "string",
            "minLength": 2,
            "maxLength": 150
          },
          "paper": {
            "type": "string",
            "minLength": 2,
            "maxLength": 150
          },
          "width": {
            "type": "integer",
            "minimum": 10,
            "maximum": 10000
          },
          "height": {
            "type": "integer",
            "minimum": 10,
            "maximum": 10000
          },
          "editionType": {
            "type": "string",
            "enum": [
              "LIMITED",
              "OPEN"
            ]
          },
          "editionTotal": {
            "anyOf": [
              {
                "type": "integer",
                "minimum": 1,
                "maximum": 1000
              },
              {
                "type": "null"
              }
            ]
          },
          "printYear": {
            "type": "integer",
            "minimum": 1800,
            "maximum": 2200
          },
          "signed": {
            "type": "boolean"
          },
          "rightsAccepted": {
            "type": "boolean",
            "const": true
          }
        },
        "required": [
          "title",
          "seriesId",
          "captureYear",
          "description",
          "genre",
          "colorMode",
          "technique",
          "paper",
          "width",
          "height",
          "editionType",
          "editionTotal",
          "printYear",
          "signed",
          "rightsAccepted"
        ],
        "additionalProperties": false
      },
      "ArtistInput": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "properties": {
          "name": {
            "type": "string",
            "minLength": 2,
            "maxLength": 150
          },
          "biography": {
            "type": "string",
            "maxLength": 5000
          },
          "statement": {
            "type": "string",
            "maxLength": 5000
          },
          "city": {
            "type": "string",
            "maxLength": 150
          }
        },
        "required": [
          "name",
          "biography",
          "statement",
          "city"
        ],
        "additionalProperties": false
      },
      "CallInput": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "properties": {
          "title": {
            "type": "string",
            "minLength": 3,
            "maxLength": 200
          },
          "organizerName": {
            "type": "string",
            "minLength": 2,
            "maxLength": 200
          },
          "sourceType": {
            "type": "string",
            "enum": [
              "EXTERNAL",
              "VERSUS_HOSTED"
            ]
          },
          "sourceUrl": {
            "anyOf": [
              {
                "type": "string",
                "format": "uri"
              },
              {
                "type": "null"
              }
            ]
          },
          "description": {
            "type": "string",
            "minLength": 20,
            "maxLength": 10000
          },
          "requirements": {
            "type": "string",
            "minLength": 10,
            "maxLength": 5000
          },
          "eligibility": {
            "type": "string",
            "maxLength": 3000
          },
          "startsAt": {
            "type": "string",
            "format": "date-time",
            "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$"
          },
          "deadlineAt": {
            "type": "string",
            "format": "date-time",
            "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$"
          },
          "timezone": {
            "type": "string",
            "minLength": 3,
            "maxLength": 100
          },
          "maxWorks": {
            "type": "integer",
            "minimum": 1,
            "maximum": 20
          },
          "feeMinor": {
            "anyOf": [
              {
                "type": "integer",
                "exclusiveMinimum": 0,
                "maximum": 9000000000000
              },
              {
                "type": "number",
                "const": 0
              }
            ]
          },
          "isDemo": {
            "default": false,
            "type": "boolean"
          }
        },
        "required": [
          "title",
          "organizerName",
          "sourceType",
          "sourceUrl",
          "description",
          "requirements",
          "eligibility",
          "startsAt",
          "deadlineAt",
          "timezone",
          "maxWorks",
          "feeMinor"
        ],
        "additionalProperties": false
      },
      "ContentInput": {
        "$schema": "https://json-schema.org/draft/2020-12/schema",
        "type": "object",
        "properties": {
          "type": {
            "type": "string",
            "enum": [
              "ARTICLE",
              "PAGE",
              "EVENT",
              "AUCTION",
              "ARCHIVE",
              "FAQ",
              "ANNOUNCEMENT"
            ]
          },
          "title": {
            "type": "string",
            "minLength": 3,
            "maxLength": 250
          },
          "slug": {
            "type": "string",
            "minLength": 2,
            "maxLength": 150,
            "pattern": "^[a-z0-9/-]+$"
          },
          "body": {
            "type": "string",
            "minLength": 20,
            "maxLength": 50000
          },
          "excerpt": {
            "type": "string",
            "maxLength": 500
          },
          "seoTitle": {
            "default": "",
            "type": "string",
            "maxLength": 200
          },
          "seoDescription": {
            "default": "",
            "type": "string",
            "maxLength": 500
          },
          "visibility": {
            "type": "string",
            "enum": [
              "PUBLIC",
              "INVITED_ONLY"
            ]
          },
          "status": {
            "type": "string",
            "enum": [
              "DRAFT",
              "PUBLISHED",
              "ARCHIVED"
            ]
          },
          "sourceUrl": {
            "anyOf": [
              {
                "type": "string",
                "format": "uri"
              },
              {
                "type": "null"
              }
            ]
          },
          "eventAt": {
            "anyOf": [
              {
                "type": "string",
                "format": "date-time",
                "pattern": "^(?:(?:\\d\\d[2468][048]|\\d\\d[13579][26]|\\d\\d0[48]|[02468][048]00|[13579][26]00)-02-29|\\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\\d|30)|(?:02)-(?:0[1-9]|1\\d|2[0-8])))T(?:(?:[01]\\d|2[0-3]):[0-5]\\d:[0-5]\\d(?:\\.\\d+)?(?:Z|([+-](?:[01]\\d|2[0-3]):[0-5]\\d)))$"
              },
              {
                "type": "null"
              }
            ]
          },
          "eventAddress": {
            "anyOf": [
              {
                "type": "string",
                "maxLength": 1000
              },
              {
                "type": "null"
              }
            ]
          },
          "capacity": {
            "anyOf": [
              {
                "type": "integer",
                "exclusiveMinimum": 0,
                "maximum": 10000
              },
              {
                "type": "null"
              }
            ]
          },
          "priority": {
            "default": 0,
            "type": "integer",
            "minimum": 0,
            "maximum": 1000
          }
        },
        "required": [
          "type",
          "title",
          "slug",
          "body",
          "excerpt",
          "visibility",
          "status",
          "sourceUrl",
          "eventAt",
          "eventAddress",
          "capacity"
        ],
        "additionalProperties": false
      },
      "Success": {
        "type": "object",
        "required": [
          "data",
          "requestId"
        ],
        "properties": {
          "data": {},
          "requestId": {
            "type": "string",
            "format": "uuid"
          }
        }
      }
    }
  }
